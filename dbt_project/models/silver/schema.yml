version: 2

models:
  - name: orders_silver
    description: "Canonical Silver table containing deduplicated, reconciled, and anonymized orders (mirroring orders_silver_v1.odcs.yaml)."
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: varchar(64)
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: varchar(64)
        data_tests:
          - not_null
      - name: customer_email_hash
        data_type: char(64)
        data_tests:
          - not_null
      - name: customer_tax_id_hash
        data_type: char(64)
        data_tests:
          - not_null
      - name: order_status
        data_type: varchar(32)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CREATED', 'PENDING_PAYMENT', 'PAID', 'SHIPPED', 'DELIVERED', 'COMPLETED', 'CANCELLED', 'REFUNDED']
      - name: payment_status
        data_type: varchar(32)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PENDING', 'AUTHORIZED', 'CAPTURED', 'FAILED', 'REFUNDED', 'CHARGEBACK']
      - name: payment_method_type
        data_type: varchar(32)
        data_tests:
          - not_null
      - name: currency_code
        data_type: char(3)
        data_tests:
          - not_null
      - name: gross_order_amount_cents
        data_type: bigint
        data_tests:
          - not_null
      - name: gross_order_amount
        data_type: decimal(18,4)
        data_tests:
          - not_null
      - name: discount_amount
        data_type: decimal(18,4)
        data_tests:
          - not_null
      - name: tax_amount
        data_type: decimal(18,4)
        data_tests:
          - not_null
      - name: shipping_amount
        data_type: decimal(18,4)
        data_tests:
          - not_null
      - name: net_order_amount
        data_type: decimal(18,4)
        data_tests:
          - not_null
      - name: order_created_at
        data_type: timestamptz
        data_tests:
          - not_null
      - name: order_updated_at
        data_type: timestamptz
        data_tests:
          - not_null
      - name: order_date
        data_type: date
        data_tests:
          - not_null
      - name: _ingested_at
        data_type: timestamptz
        data_tests:
          - not_null

  - name: fct_daily_revenue
    description: "Gold FinOps table for daily Official Recognized Net Revenue and GMV by currency and payment method."
    columns:
      - name: revenue_grain_sk
        data_tests:
          - unique
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: gmv_amount
        data_tests:
          - not_null
      - name: recognized_net_revenue
        data_tests:
          - not_null
