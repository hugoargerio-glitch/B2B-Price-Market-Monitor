name: B2B Price Monitor — CDC Engine, ODCS v3.2.0 & Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-cdc-engine-and-contracts:
    name: Pytest (65 Checks) + ODCS v3.2.0 Contract + Docker Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv (Python 3.12 Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Virtual Environment (.venv)
        run: uv sync --frozen

      - name: Gate 1 — Lint Executable ODCS v3.2.0 Data Contract
        run: uv run datacontract lint ./contracts/b2b_price_monitor_v1.odcs.yaml

      - name: Gate 2 — Execute 65 Unit, Integration & SQL Invariant Tests
        run: uv run pytest -v

      - name: Gate 3 — Verify End-to-End CLI Simulation, Outbox Dispatch & Housekeeping
        run: |
          uv run python -m src.main run --items 5 --dry-run
          uv run python -m src.main ingest --file examples/sample_scrape_batch.json
          uv run python -m src.main clean-outbox --days 30
          uv run python -m src.main vacuum

      - name: Gate 4 — Build & Verify Multi-Stage Docker Container
        run: |
          docker build -t b2b-price-monitor:ci .
          docker run --rm --entrypoint pytest b2b-price-monitor:ci -v
          docker run --rm b2b-price-monitor:ci run --items 5 --dry-run
